services:
  # Web Service
  - type: web
    name: tvet-system
    plan: free
    env: docker
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://tvet-system.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: tvet-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tvet-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: tvet-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tvet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tvet-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

databases:
  # PostgreSQL Database
  - name: tvet-db
    databaseName: tvet_db
    user: tvet_user
    plan: free
