# fly.toml app configuration file generated for tvet-system on 2025-01-05T00:00:00+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "tvet-system"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_NAME = "AceTVET"
  APP_URL = "https://tvet-system.fly.dev"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "error"
  SESSION_DRIVER = "file"
  CACHE_DRIVER = "file"
  QUEUE_CONNECTION = "sync"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "10s"
  grace_period = "5s"
  method = "GET"
  path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[deploy]
  strategy = "canary"
